name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: krpt-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: krpt-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename and prepare binary
        shell: bash
        run: |
          # Handle binary naming for different platforms (adds .exe if windows, though we are using linux/mac)
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv target/${{ matrix.target }}/release/krpt.exe ${{ matrix.asset_name }}.exe
          else
            mv target/${{ matrix.target }}/release/krpt ${{ matrix.asset_name }}
          fi
          
          # Verify the file was moved successfully
          ls -la krpt-*

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}